- name: create ec2 instances and r53 records
  hosts: localhost
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: lkawsdevops.online
    ami_id: ami-0055977a6e828a4f4
    sg_mapping:
      mongodb: sg-0a30effe2e6ed1c45
      redis: sg-0ae38ad2f21da2f3a
      mysql: sg-01e4a1b171295d02e
      rabbitmq: sg-010bdcd593c1ddaad
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:  
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups: 
      - sg-07c25f0365cc7b781     # roboshop-common ID
      - "{{ sg_mapping[item] }}"  # component-specific ID
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: instance
    


  # - name: print ec2 creation ec2_output
  #   debug: 
  #     msg:  "{{ instance }}"  

      ## now we got the instances output and that stored in ec2_output file here 
      ## here we loop the first item, and that is mongodb
      ## when looped we get item keyword  {{ item.instances }} in this to to refer first item we use [0].private_ip_address
      ## {{ item.instances[0].private_ip_address }}


  - name: create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      overwrite: true
      value: "{{ item.instances[0].private_ip_address }}"
    loop: "{{ ec2_output.results }}"     
    when: action == "create"