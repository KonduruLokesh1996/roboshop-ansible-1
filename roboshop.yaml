- name: create ec2 instances and r53 records
  hosts: localhost
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: lkawsdevops.online
    ami_id: ami-0055977a6e828a4f4
    sg_mapping:
      mongodb: sg-0a30effe2e6ed1c45
      redis: sg-0ae38ad2f21da2f3a
      mysql: sg-01e4a1b171295d02e
      rabbitmq: sg-010bdcd593c1ddaad
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:  
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups: 
      - sg-07c25f0365cc7b781     # roboshop-common ID
      - "{{ sg_mapping[item] }}"  # component-specific ID
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: instance
    

  - name: create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      overwrite: true
      value: "{{ item.instances[0].private_ip_address }}"
    loop: "{{ instance.results }}"    
    when: action == "create"