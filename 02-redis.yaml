- name: configure redis server
  hosts: redis
  become: yes
  tasks:
  - name: enable redis 7
    command: dnf module enable redis:7 -y

  - name: install redis
    package:
      name: redis
      state: present

  - name: allow remote connection
    replace:
      path: /etc/redis/redis.conf
      regex: '127.0.0.1'
      replace: '0.0.0.0'

  - name: disable protected module
    lineinfile:
      path: /etc/redis/redis.conf
      regex: 's/^protected-mode yes'
      replace: 'protected-mode no'          